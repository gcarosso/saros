<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".33" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".42" stop-color="#f2f5ff" stop-opacity=".8"/>
      <stop offset=".55" stop-color="#e3e9f6" stop-opacity=".38"/>
      <stop offset=".75" stop-color="#d6ddeb" stop-opacity=".12"/>
      <stop offset="1" stop-color="#d6ddeb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="streak" cx="20%" cy="50%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="haze" filterUnits="userSpaceOnUse" x="-34" y="-34" width="68" height="68"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="rim" filterUnits="userSpaceOnUse" x="-34" y="-34" width="68" height="68"><feGaussianBlur stdDeviation=".8"/></filter>
  </defs>
  <g transform="translate(32 32)">
    <!-- streamers as in the photograph: a long one to the upper right, a long one to the lower left, shorter ones upper left and down -->
    <g filter="url(#haze)">
      <ellipse cx="18" cy="0" rx="18" ry="4.6" fill="url(#streak)" transform="rotate(-42)"/>
      <ellipse cx="17" cy="0" rx="17" ry="5" fill="url(#streak)" transform="rotate(136)"/>
      <ellipse cx="14" cy="0" rx="14" ry="5" fill="url(#streak)" transform="rotate(-118)"/>
      <ellipse cx="14" cy="0" rx="14" ry="3.8" fill="url(#streak)" transform="rotate(72)"/>
      <ellipse cx="13" cy="0" rx="13" ry="3.2" fill="url(#streak)" transform="rotate(12)" opacity=".7"/>
    </g>
    <!-- diffuse corona -->
    <circle r="31" fill="url(#glow)"/>
    <circle r="21.5" fill="#ffffff" fill-opacity=".6" filter="url(#haze)"/>
    <!-- inner corona: brilliant -->
    <circle r="19.4" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="2.8" filter="url(#rim)"/>
    <!-- the moon -->
    <circle r="17.6" fill="#03040a"/>
    <circle r="17.6" fill="none" stroke="#ffffff" stroke-width="1.1"/>
    <!-- chromosphere / prominences -->
    <path d="M-4,-17.2 A17.6,17.6 0 0 1 9,-15.2" fill="none" stroke="#ff5f7a" stroke-width="1.3" stroke-opacity=".85" stroke-linecap="round" filter="url(#rim)"/>
    <path d="M13.5,10.8 A17.6,17.6 0 0 1 10.2,14.2" fill="none" stroke="#ff8aa0" stroke-width="1" stroke-opacity=".6" stroke-linecap="round" filter="url(#rim)"/>
  </g>
</svg>
